<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FL Stats Converter</title>
<style>
:root{--bg:#0c1016;--surface:#141a22;--surface2:#1b232d;--line:#263140;--text:#e7ecf2;--muted:#8b98a8;--accent:#e0393f;--accent-ink:#fff;--good:#4fcf6a;--bad:#d9534f;--warn:#e8b630;--font-display:"Barlow Condensed","Arial Narrow",sans-serif;--font-body:"Barlow","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;margin:0}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;gap:10px;align-items:center}.brand .logo{width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.2rem}
.brand b{font-family:var(--font-display);font-size:1.25rem;line-height:1.05;display:block}.brand small{color:var(--muted)}
select,input,textarea{background:#0b1225;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;letter-spacing:.02em;cursor:pointer;font-family:inherit}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:.8rem}.btn:disabled{opacity:.45;cursor:default}
.clubs{display:flex;flex-direction:column;gap:3px;overflow:auto}
.cl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.cl:hover{background:var(--surface2)}.cl.on{background:var(--surface2);border-color:var(--accent)}.cl small{color:var(--muted)}
.crw{display:inline-grid;place-items:center;width:28px;height:30px}.crw img{max-width:100%;max-height:100%}
.main{padding:22px 26px}
.hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.hd h1{font-size:2.1rem;line-height:1.05}.hd .sp{flex:1}.chip{display:inline-block;font-size:.76rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08)}.chip.g{background:rgba(79,207,106,.16);color:#7bdc8a}.chip.r{background:rgba(217,83,79,.18);color:#ff8a85}.chip.y{background:rgba(232,182,48,.18);color:#f0cd6a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;cursor:pointer;align-items:center}.card:hover{border-color:var(--accent)}.card.done{opacity:.5;filter:grayscale(.7)}.card.done:hover{opacity:.85;filter:none}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#1b232d}
.card b{display:block;font-family:var(--font-display);font-size:1.1rem;line-height:1.1}.card .m{color:var(--muted);font-size:.8rem}.card .o{font-size:.95rem;margin-top:3px}
.ovr{font-weight:700}.up{color:#8be28b}.dn{color:#f08a8a}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}.drawer.on{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(1280px,96vw);background:var(--surface);border-left:1px solid var(--line);padding:18px 22px;overflow:auto}
.phd{display:flex;gap:14px;align-items:center;margin-bottom:10px}.phd .av{width:72px;height:72px}.phd h2{font-size:1.7rem;text-transform:none;letter-spacing:.02em;color:var(--text)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}@media(max-width:900px){.src{grid-template-columns:1fr}}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.box h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sf-st{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0;font-size:.82rem}.sf-st span{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07)}.sf-st .p{background:rgba(79,207,106,.16);color:#8be28b}.sf-st .m{background:rgba(217,83,79,.18);color:#f08a8a}
.sf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:4px 16px;align-items:start}
.sf-g{margin-top:4px}.sf-gh{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.sf-r{display:grid;grid-template-columns:1fr auto 78px;gap:8px;align-items:center;background:rgba(255,255,255,.04);border-radius:8px;padding:5px 8px;margin:3px 0}.sf-r b{font-weight:700}.sf-r small{display:block;color:var(--muted);font-size:.7rem;line-height:1.3}.sf-v{white-space:nowrap;text-align:right}.sf-v em{font-style:normal;margin-left:4px}.sf-o{font-size:.72rem;text-align:right}.ed{width:58px;display:inline-block;padding:2px 6px;font-weight:700;text-align:right}.ed.on{border-color:var(--accent)}.sf-o i{display:block;height:4px;border-radius:2px;margin-top:2px;margin-left:auto}
.lst{display:grid;gap:4px;max-height:300px;overflow:auto}.lst div{display:flex;justify-content:space-between;gap:8px;align-items:center;background:rgba(255,255,255,.04);border-radius:8px;padding:5px 9px}.lst small{color:var(--muted)}
.foot{position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 6px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);margin-top:14px}
.msg{padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);margin:8px 0}.msg.ok{border-color:#2f7a42}.msg.err{border-color:#8a3a38}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:30}.dlg.on{display:grid}.dlg .in{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:min(760px,94vw);max-height:90vh;overflow:auto}
.mut{color:var(--muted)}
</style></head><body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">FL</div><div><b>FL STATS CONVERTER</b><small>EA FC → Player.bin</small></div></div>
  <div id="info" class="mut" style="font-size:.8rem"></div>
  <div class="box" id="st" style="font-size:.82rem"></div>
  <select id="lg"></select>
  <div id="clubs" class="clubs"></div>
  <div style="margin-top:auto;display:grid;gap:6px"><label style="display:flex;gap:8px;align-items:center;font-size:.82rem" title="Young players whose potential is far above their rating get +1 to +3 overall in advance (age up to 22): they are closer to their potential, the development in a career has less to catch up."><input type="checkbox" id="yb" checked style="width:auto"> Youth bonus (+0 to +3)</label><button class="btn sm" id="allB2">Convert the whole database …</button><button class="btn ghost sm" id="misB2">Not found in the database …</button><button class="btn ghost sm" id="fmcB">FM calibration …</button><button class="btn ghost sm" id="bkB">Backups …</button></div>
</aside>
<main class="main" id="main"><h1>Choose a league and a club</h1><p class="mut">The values are converted from the EA FC database and written into the Player.bin that you chose. Before every write the tool makes a backup and checks the result. The overall of the EA FC database is the target.</p></div>
</div>
<div class="drawer" id="dr"><div class="panel" id="pn"></div></div>
<div class="dlg" id="dl"><div class="in" id="dli"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:undefined);return r.json()}
const crest=(n,z)=>'';
const face=(pid,z)=>'<span class="av" style="display:inline-block;'+(z?'width:'+z+'px;height:'+z+'px':'')+';background:#1c2130 url(\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><circle cx=%2220%22 cy=%2215%22 r=%228%22 fill=%22%23465%22/><path d=%22M4 40c0-10 7-15 16-15s16 5 16 15%22 fill=%22%23465%22/></svg>\') center/cover"></span>';
const SD=n=>(n>0?'+':'')+n;
const CAT=[['Attacking',['OffensiveAwareness','Finishing','KickingPower']],['Dribbling',['BallControl','Dribbling','TightPossession','Balance']],['Passing',['LowPass','LoftedPass','PlaceKicking','Curl']],['Defending',['Heading','Jump','DefensiveAwareness','BallWinning','Aggression']],['Physicality',['Speed','Acceleration','PhysicalContact','Stamina']],['Goalkeeping',['GKAwareness','GKCatching','GKClearing','GKReflexes','GKReach']]];
const YB=()=>$('#yb').checked;
let LG=[],CUR=null,CLUB=null,PID=null,CH={};
async function init(){const r=await api('/api/init');LG=r.leagues;$('#info').innerHTML=r.players.toLocaleString()+' players in the database<br>'+r.ea.toLocaleString()+' players in '+E(r.csv);
  $('#lg').innerHTML='<option value="">Choose a league …</option>'+LG.map(l=>'<option value="'+l.id+'">'+E(l.name)+' ('+l.n+')</option>').join('');}
$('#lg').onchange=async e=>{if(!e.target.value)return;$('#clubs').innerHTML='<p class="mut">Searching the database …</p>';CUR=await api('/api/league?id='+e.target.value);
  $('#clubs').innerHTML=CUR.clubs.map(c=>'<div class="cl" data-t="'+c.tid+'">'+crest(c.name)+'<span>'+E(c.name)+'</span><small>'+c.found+'/'+c.n+'</small></div>').join('')+'<button class="btn ghost sm" id="allB" style="margin-top:8px">Convert the whole league …</button><button class="btn ghost sm" id="misB" style="margin-top:6px">Not found in this league …</button>';
  $('#misB').onclick=()=>missing(+e.target.value,CUR.name);
  $('#allB').onclick=()=>bulk(CUR.clubs.map(c=>c.tid),CUR.name)};
document.addEventListener('click',e=>{const c=e.target.closest('.cl');if(c)openClub(+c.dataset.t)});
async function openClub(t){document.querySelectorAll('.cl').forEach(x=>x.classList.toggle('on',+x.dataset.t===t));$('#main').innerHTML='<p class="mut">Loading …</p>';CLUB=await api('/api/club?tid='+t+'&youth='+(YB()?1:0));
  const bad=CLUB.players.filter(p=>p.status!=='ok').length;
  $('#main').innerHTML='<div class="hd">'+crest(CLUB.name,56)+'<div><h1>'+E(CLUB.name)+'</h1><span class="mut">'+E(CLUB.league||'')+'</span></div><span class="sp"></span><span class="chip g">'+CLUB.found+' found</span>'+(bad?'<span class="chip y">'+bad+' to check</span>':'')+(CLUB.done?'<span class="chip">'+CLUB.done+' already converted</span>':'')+'<button class="btn" id="cB">Convert the club …</button></div>'+(bad?'<div class="box" style="margin:0 0 14px"><h3>Not found or to check · '+bad+' (best first)</h3><div class="grid">'+CLUB.players.filter(p=>p.status!=='ok').sort((a,b)=>b.ovr-a.ovr).map(card).join('')+'</div></div>':'')+'<div class="grid">'+CLUB.players.filter(p=>p.status==='ok').map(card).join('')+'</div>';
  $('#cB').onclick=()=>bulk([t],CLUB.name)}
function card(p){const st=p.done?'<span class="chip g">✓ converted · '+E(p.done)+'</span>':p.stale?'<span class="chip y" title="The tool wrote this player earlier, but the values in the database differ from what the current source gives">changed since · convert again</span>':p.status==='ok'?'<span class="chip g">found</span>':p.status==='ambiguous'?'<span class="chip y">check</span>':'<span class="chip r">not found</span>';
  return '<div class="card'+(p.done?' done':'')+'" data-p="'+p.pid+'" title="'+(p.done?'Already converted ('+E(p.done)+'): the values in the database are the result of the conversion':'')+'">'+face(p.pid)+'<div><b>'+E(p.name)+'</b><div class="m">'+E(p.pos)+' · '+(p.age||'?')+' y</div><div class="o">'+(p.ea?'<span class="ovr">'+p.ovr+'</span> → <span class="ovr '+(p.ea.rating>p.ovr?'up':p.ea.rating<p.ovr?'dn':'')+'">'+p.ea.rating+'</span> ':'<span class="ovr">'+p.ovr+'</span> ')+st+'</div></div></div>'}
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openPlayer(+c.dataset.p)});
function steps(r){const s=r.steps;const a=[['EA values (converter)',s.addon-s.cur],['Scale',s.scale-s.addon],['Position',s.pos-s.scale],['Fit to the EA overall',s.fit-s.pos]];if(r.months)a.push(['Development to '+r.date+' ('+SD(r.months)+' months)',s.final-s.fit]);
  return '<div class="sf-st"><b>How the overall comes about:</b> <span>now '+s.cur+'</span>'+a.map(x=>'<span class="'+(x[1]>0?'p':x[1]<0?'m':'')+'">'+x[0]+' '+SD(x[1])+'</span>').join('')+(r.youth?'<span class="p">Youth bonus +'+r.youth+' (age '+r.age+')</span>':'')+'<span><b>= '+s.final+'</b>'+(r.ovr_target!=null?' (EA overall '+r.ovr_target+')':'')+'</span></div>'}
function line(x){const p=[];if(x.src&&x.src.length)p.push(x.src.map(s=>E(s[0])+' '+s[1]).join(' · ')+(x.base!=null?' → PES '+x.base:''));else p.push('value '+x.sofifa);if(x.model)p.push('keeper model');if(x.adj)p.push(SD(x.adj)+' rule');if(x.pc)p.push(SD(x.pc)+' scale');if(x.pb)p.push(SD(x.pb)+' position');if(x.fit)p.push(SD(x.fit)+' fit to the overall');if(x.ts)p.push(SD(x.ts)+' development');if(x.edited)p.push('your value');return p.join(' · ')+' = '+x.final}
function rows(r){const by={};r.rows.forEach(x=>by[x.attr]=x);const grp=(t,L)=>{const R=L.filter(a=>by[a]).map(a=>by[a]);if(!R.length)return '';const tot=R.reduce((q,x)=>q+(x.oe||0),0);
  return '<div class="sf-g"><div class="sf-gh"><span>'+t+'</span><span>'+(tot?SD(Math.round(tot*100)/100)+' OVR':'')+'</span></div>'+R.map(x=>{const d=x.final-x.cur;return '<div class="sf-r" title="'+E(x.rule||'')+'"><div><b>'+E(x.attr.replace(/([a-z])([A-Z])/g,'$1 $2'))+'</b><small>'+line(x)+'</small></div><div class="sf-v">'+x.cur+' → <input class="ed'+(x.edited?' on':'')+'" data-a="'+x.attr+'" type="number" min="40" max="99" value="'+x.final+'" title="Type your own value">'+(d?'<em class="'+(d>0?'up':'dn')+'">('+SD(d)+')</em>':'')+'</div><div class="sf-o"><span class="'+(x.oe>0?'up':x.oe<0?'dn':'')+'">'+SD(x.oe)+' OVR</span><i style="background:'+(x.oe>=0?'#4fcf6a':'#d9534f')+';width:'+Math.min(100,Math.abs(x.oe)*120)+'%"></i></div></div>'}).join('')+'</div>'};
  return '<div class="sf-grid">'+CAT.map(c=>grp(c[0],c[1])).join('')+'</div>'}
async function openPlayer(pid,opts){PID=pid;opts=opts||CH[pid]||{};CH[pid]=opts;$('#dr').classList.add('on');
  $('#pn').innerHTML='<p class="mut">Loading …</p>';const r=await api('/api/preview',{pid,db_id:opts.db_id,fm:opts.fm,target:opts.target,edits:opts.edits,youth:YB()});
  const nm=(CLUB&&CLUB.players.find(p=>p.pid===pid)||{}).name||r.name||'';
  let h='<div class="phd">'+face(pid)+'<div><h2>'+E(nm)+'</h2><span class="mut">'+E((CLUB&&CLUB.name)||r.club||'')+'</span></div><span style="flex:1"></span><button class="btn ghost sm" id="xB">Close</button></div>';
  h+='<div class="src"><div class="box"><h3>Source <a class="btn ghost sm" style="margin-left:8px" target="_blank" rel="noopener" href="https://sofifa.com/players?keyword='+encodeURIComponent(nm)+'">Search SoFIFA</a> <a class="btn ghost sm" target="_blank" rel="noopener" href="https://fminside.net/players?q='+encodeURIComponent(nm)+'&database_id=9">Search FMInside</a></h3>'+(r.ok?'<div>'+(r.db?'<b>'+E(r.db.name)+'</b> · '+E(r.db.club)+' · '+E(r.db.nation)+' · EA overall <b>'+r.db.rating+'</b>'+(r.assigned?' <span class="chip g" title="You chose this player once, the tool remembers it">assigned by you</span> <button class="btn ghost sm" id="unA">Forget</button>':''):(r.sofifa?'<b>SoFIFA page</b> · overall <b>'+r.sofifa.overall+'</b>'+(r.sofifa.potential?' · potential '+r.sofifa.potential:''):'<b>FMInside page</b>')+(r.fm?(r.fm_est&&r.fm_est.length?' · <span class="mut">'+E(r.fm_est.join(' and '))+' are hidden or only a range on the page (generated when a save starts): a value that fits the rest is used</span>':'')+' · calibration '+(r.fm.active?'active ('+r.fm.n+' samples)':r.fm.n+' of 6 samples, not active'):''))+'</div>':'<div class="msg err" style="margin:0">'+E(r.msg||'')+'</div>')+
    '<div style="margin-top:8px"><h3>Not the right player? Choose or search</h3><select id="cs"><option value="">Probable players …</option></select><div style="display:flex;gap:6px;margin-top:6px"><input id="sq" placeholder="Search by name or club …"><button class="btn ghost sm" id="sB">Search</button></div></div></div>'+
    '<div class="box"><h3>Or paste a SoFIFA or FMInside page</h3><textarea id="fmT" rows="5" placeholder="Ctrl+A, Ctrl+C on the player page of sofifa.com or fminside.net, paste here"></textarea><div style="margin-top:6px"><button class="btn ghost sm" id="fmB">Use this page</button> <span class="mut" style="font-size:.78rem">SoFIFA: its overall is the target. FMInside: for players that are not in EA FC at all.</span></div></div></div>';
  if(r.ok){const nm=r.names||{};h+='<div class="box" style="margin:8px 0"><h3>Names (written to the database file)'+(r.names_ea?' <button class="btn ghost" id="nEA" style="padding:2px 10px;margin-left:8px">Take from EA FC: '+E(r.names_ea.name)+' / '+E(r.names_ea.shirt)+'</button>':'')+'</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px"><label>Name<input id="nN" value="'+E(nm.name||'')+'"></label><label>Shirt name<input id="nS" value="'+E(nm.shirt||'')+'"></label><label>Shirt name national team<input id="nT" value="'+E(nm.nshirt||'')+'"></label></div></div>'}
  if(r.ok){h+='<div class="msg">Overall now <b>'+r.ovr_cur+'</b> → <b>'+r.ovr_new+'</b>'+(r.ovr_target!=null?' (EA FC: '+r.ovr_target+')':'')+' · target overall: <input id="tg" type="number" min="40" max="99" value="'+(opts.target||r.ovr_target||'')+'" style="width:80px;display:inline-block"> <button class="btn ghost sm" id="tgB">Adjust</button></div>'+steps(r)+rows(r)+'<div class="foot"><button class="btn" id="wB">Write this player into the database</button></div>'}
  $('#pn').innerHTML=h;$('#xB').onclick=()=>$('#dr').classList.remove('on');
  const cl=await api('/api/candidates?pid='+pid);$('#cs').innerHTML+=cl.items.map(c=>'<option value="'+E(c.id)+'">'+E(c.name)+' · '+E(c.club)+' · '+E(c.pos)+' · '+c.rating+'</option>').join('');
  $('#cs').onchange=e=>{if(e.target.value)openPlayer(pid,{db_id:e.target.value})};
  $('#sB').onclick=async()=>{const q=$('#sq').value.trim();if(q.length<2)return;const s=await api('/api/search?q='+encodeURIComponent(q));$('#cs').innerHTML='<option value="">'+s.items.length+' found …</option>'+s.items.map(c=>'<option value="'+E(c.id)+'">'+E(c.name)+' · '+E(c.club)+' · '+E(c.pos)+' · '+c.rating+'</option>').join('')};
  $('#sq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#sB').click()}};
  $('#fmB').onclick=()=>{const t=$('#fmT').value;if(t.trim())openPlayer(pid,{fm:t})};
  if(r.ok){if($('#unA'))$('#unA').onclick=async()=>{await api('/api/unassign',{pid});delete CH[pid];openPlayer(pid,{})};if($('#nEA'))$('#nEA').onclick=()=>{$('#nN').value=r.names_ea.name;$('#nS').value=r.names_ea.shirt;$('#nT').value=r.names_ea.nshirt};$('#tgB').onclick=()=>openPlayer(pid,Object.assign({},opts,{target:+$('#tg').value||null}));$('#wB').onclick=()=>writeOne(pid)}}
async function writeOne(pid){const b=$('#wB');b.disabled=true;const nn=()=>{const g=i=>($(i)||{}).value;return {name:g('#nN'),shirt:g('#nS'),nshirt:g('#nT')}};const cz=Object.assign({},CH[pid]||{},{names:nn()});const r=await api('/api/apply',{pids:[pid],choices:{[pid]:cz},youth:YB(),force:true});
  $('.foot').insertAdjacentHTML('afterbegin','<div class="msg '+(r.ok?'ok':'err')+'" style="flex:1;margin:0">'+(r.ok?'Written: '+r.written+' player'+(r.names?' and '+r.names+' name(s)':'')+'. '+E(((r.backup||'')+'').split('/').pop()):E(r.msg||'failed'))+'</div>');b.disabled=false;if(r.ok){const keep=$('.foot .msg')?$('.foot .msg').outerHTML:'';await reloadAll(pid);if(keep){const f=$('.foot');if(f)f.insertAdjacentHTML('afterbegin',keep)}}}
async function reloadAll(pid){const t=CLUB&&CLUB.tid;if($('#lg').value){const L=await api('/api/league?id='+$('#lg').value);CUR=L;$('#clubs').querySelectorAll('.cl').forEach(x=>{const c=L.clubs.find(k=>k.tid===+x.dataset.t);if(c)x.querySelector('small').textContent=c.found+'/'+c.n})}
  if(t){CLUB=await api('/api/club?tid='+t+'&youth='+(YB()?1:0));const m=$('#main');if(m){const y=m.scrollTop;await openClub(t);m.scrollTop=y}}
  if(pid&&$('#dr').classList.contains('on'))await openPlayer(pid)}
const EAN=()=>!!($('#eaN')&&$('#eaN').checked);
async function missing(id,name){const d=$('#dl');d.classList.add('on');$('#dli').innerHTML='<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Not found · '+E(name)+'</h2><p class="mut">Searching …</p>';
  const r=await api('/api/missing'+(id!=null?'?id='+id:''));
  $('#dli').innerHTML='<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Not found · '+E(name)+'</h2><p>'+r.total.toLocaleString()+' of '+r.of.toLocaleString()+' players are not found in the EA FC database or are uncertain'+(r.total>r.players.length?' (the best '+r.players.length+' are shown)':'')+'. Click one to search or paste a page.</p><div class="lst" style="max-height:60vh">'+r.players.map(x=>'<div class="mp" data-p="'+x.pid+'" style="cursor:pointer"><span>'+E(x.name)+' <small class="mut">'+E(x.pos)+' · '+(x.age||'?')+' y · '+E(x.club||'no club')+'</small></span><b>'+x.ovr+(x.status==='ambiguous'?' · check':'')+'</b></div>').join('')+'</div><div class="foot" style="position:static"><button class="btn ghost" id="bC">Close</button></div>';
  $('#bC').onclick=()=>d.classList.remove('on');document.querySelectorAll('#dli .mp').forEach(e=>e.onclick=()=>{d.classList.remove('on');openPlayer(+e.dataset.p)})}
async function bulk(tids,name){const d=$('#dl');d.classList.add('on');$('#dli').innerHTML='<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Convert '+E(name)+'</h2><p class="mut">Searching …</p>';
  const r=await api('/api/apply',{tids,dry:true,youth:YB(),ea_names:EAN()});const ok=r.report.filter(x=>x.ok),bad=r.report.filter(x=>!x.ok);
  const dsum=ok.reduce((q,x)=>q+(x.ovr_new-x.ovr_cur),0);
  $('#dli').innerHTML='<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Convert '+E(name)+'</h2><p>'+ok.length+' players can be converted (found unambiguously), mean change of the overall '+(ok.length?SD(Math.round(dsum/ok.length*10)/10):'0')+'. '+bad.length+' not written: not found, uncertain or the source lacks values; open them one by one.</p><div class="lst">'+ok.map(x=>'<div><span>'+E(x.name)+'</span><b>'+x.ovr_cur+' → '+x.ovr_new+'</b></div>').join('')+'</div>'+(bad.length?'<h3 style="margin:10px 0 4px">Not written · '+bad.length+' (best first)</h3><div class="lst">'+bad.slice().sort((a,b)=>(b.ovr||0)-(a.ovr||0)).map(x=>'<div><span>'+E(x.name)+'</span><b>'+(x.ovr||'')+' · '+E(x.msg||'')+'</b></div>').join('')+'</div>':'')+'<label style="display:block;margin:8px 0"><input type="checkbox" id="eaN"> Also take the names (common name / first + last name, shirt name) from EA FC</label><div class="foot" style="position:static"><button class="btn ghost" id="bC">Cancel</button><button class="btn" id="bW">Write '+ok.length+' players into the database</button></div>';
  $('#bC').onclick=()=>d.classList.remove('on');$('#bW').onclick=async()=>{$('#bW').disabled=true;const w=await api('/api/apply',{tids,youth:YB(),ea_names:EAN()});$('#dli').insertAdjacentHTML('afterbegin','<div class="msg '+(w.ok?'ok':'err')+'">'+(w.ok?'Written: '+w.written+' players. Backup: '+E((w.backup||'').split('/').pop()):E(w.msg||'failed'))+'</div>');if(w.ok&&CLUB)openClub(CLUB.tid)}}
$('#bkB').onclick=async()=>{const r=await api('/api/backups');const d=$('#dl');d.classList.add('on');$('#dli').innerHTML='<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Backups of Player.bin</h2><p class="mut">A backup is made before every write. Restoring replaces the database file by the chosen one (after a backup of the current file).</p><div class="lst">'+(r.items.map(b=>'<div><span>'+E(b.when)+' <small>'+E(b.file)+'</small></span><button class="btn ghost sm" data-rf="'+E(b.file)+'">Restore</button></div>').join('')||'<div>No backups yet.</div>')+'</div><div class="foot" style="position:static"><button class="btn ghost" id="bC">Close</button></div>';$('#bC').onclick=()=>d.classList.remove('on')};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-rf]');if(!b)return;if(!confirm('Restore '+b.dataset.rf+'?'))return;const r=await api('/api/restore',{file:b.dataset.rf});b.textContent=r.ok?'Restored':(r.msg||'failed')});
function fmcHtml(v,rep){const dif=v.diff||[],act=new Map((v.attrs||[]).map(x=>[x.attr,x]));
  return '<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">FM calibration</h2><p class="mut">Paste the pages of FMInside players that are also in the EA FC database (Ctrl+A, Ctrl+C on each page; many pages can be pasted one after the other). The tool finds them in the EA FC database and learns how the FM values have to be moved to the EA FC level, attribute by attribute: from 6 players a shift, from 12 players also a slope.</p>'
  +'<div class="msg"><b>'+v.n+'</b> players learned · '+(v.active?'<span class="chip g">calibration active</span>':'<span class="chip y">not active (needs 6 players)</span>')+' <button class="btn ghost sm" id="fcC" style="float:right">Forget all</button></div>'
  +(dif.length?'<div class="lst" style="max-height:260px">'+dif.map(d=>{const a=act.get(d.attr);return '<div><span>'+E(d.attr.replace(/([a-z])([A-Z])/g,'$1 $2'))+'</span><b class="'+(d.mean>0?'up':d.mean<0?'dn':'')+'">EA − FM '+SD(d.mean)+(a?' <small>· '+(a.method==='none'?'left as it is (error '+a.before+')':(a.method==='shift'?'shift ':'shift + slope ')+'· error '+a.before+' → '+a.after)+'</small>':'')+'</b></div>'}).join('')+'</div>':'')
  +'<textarea id="fcT" rows="6" style="margin-top:10px" placeholder="FMInside pages …"></textarea><div class="foot" style="position:static"><button class="btn ghost" id="bC">Close</button><button class="btn" id="fcA">Add these pages</button></div>'
  +(rep?'<div class="lst" style="margin-top:8px">'+rep.map(x=>'<div><span>'+E(x.name||'?')+'</span><b class="'+(x.ok?'up':'dn')+'">'+(x.ok?'added · '+E(x.club||''):E(x.msg))+'</b></div>').join('')+'</div>':'')}
async function fmcOpen(rep,view){const v=view||await api('/api/fmcal');const d=$('#dl');d.classList.add('on');$('#dli').innerHTML=fmcHtml(v,rep);$('#bC').onclick=()=>d.classList.remove('on');
  $('#fcA').onclick=async()=>{const t=$('#fcT').value;if(t.trim().length<50)return;$('#fcA').disabled=true;const r=await api('/api/fmcal/add',{text:t});fmcOpen(r.report,r.view)};
  $('#fcC').onclick=async()=>{if(!confirm('Forget all samples?'))return;const r=await api('/api/fmcal/clear',{});fmcOpen(null,r.view)}}
$('#fmcB').onclick=()=>fmcOpen();
function allHtml(j,rest){const R=j&&j.result?j.result:null,c=R?R.counts:{};
  return '<h2 style="font-size:1.4rem;text-transform:none;color:var(--text)">Convert the whole database</h2><p class="mut">Every player of the database is looked up in the EA FC export (name, club, date of birth, overall). Found players are converted like in the club view (overall of EA FC, youth bonus). Players that are not in the export (leagues that EA FC does not have, older players) can be brought to the EA FC level: the profile stays, the level goes down by the usual difference of the game to EA FC (about 3 to 4.5 overall points, by age), so that the leagues stay comparable.</p>'
  +'<div class="msg">Players that are not in the EA FC export: <select id="rest" style="width:auto;display:inline-block"><option value="scale"'+(rest==='scale'?' selected':'')+'>bring to the EA FC level</option><option value="keep"'+(rest==='keep'?' selected':'')+'>leave unchanged</option></select></div>'
  +'<div id="jb"></div><div class="foot" style="position:static"><button class="btn ghost" id="bC">Close</button><button class="btn ghost" id="aD">Check first (nothing is written)</button><button class="btn" id="aW" '+(R&&j.dry?'':'disabled')+'>Write into the database</button></div>'}
function allShow(j){const el=$('#jb');if(!el)return;if(!j||j.state==='idle'){el.innerHTML='';return}
  if(j.state==='running'){const p=Math.round(100*j.done/j.total);el.innerHTML='<div class="msg">'+(j.phase==='writing'?'Writing and checking …':'Working … '+j.done.toLocaleString()+' of '+j.total.toLocaleString()+' players')+'<div style="height:6px;background:var(--surface);border-radius:3px;margin-top:8px"><i style="display:block;height:100%;width:'+p+'%;background:var(--accent);border-radius:3px"></i></div></div>';return}
  if(j.state==='error'){el.innerHTML='<div class="msg err">'+E(j.msg||(j.write&&j.write.msg)||'failed')+'</div>';return}
  const c=j.result.counts;el.innerHTML='<div class="msg '+(j.dry?'':'ok')+'"><b>'+(j.dry?'Check finished':'Written')+'</b> ('+j.secs+' s)<br>Converted from EA FC: <b>'+(c.converted||0).toLocaleString()+'</b> (mean change of the overall '+SD(j.result.mean_converted)+') · brought to the EA FC level: <b>'+(c.scaled||0).toLocaleString()+'</b> (mean '+SD(j.result.mean_scaled)+') · already as it should be: '+(c.already||0).toLocaleString()+' · left unchanged: '+(c.kept||0).toLocaleString()+(c.failed?' · failed: '+c.failed:'')+(j.write&&j.write.ok?'<br>Backup: '+E(j.write.backup.split('/').pop()):'')+'</div>'}
async function allOpen(){const d=$('#dl');d.classList.add('on');let j=await api('/api/job');$('#dli').innerHTML=allHtml(j,'scale');allShow(j);$('#bC').onclick=()=>d.classList.remove('on');
  const run=async dry=>{const rest=$('#rest').value;await api('/api/bulk',{rest,dry,youth:YB()});$('#aD').disabled=true;$('#aW').disabled=true;const t=setInterval(async()=>{const x=await api('/api/job');allShow(x);if(x.state!=='running'){clearInterval(t);$('#aD').disabled=false;$('#aW').disabled=!(x.state==='done'&&x.dry);if(x.state==='done'&&!x.dry&&CLUB)openClub(CLUB.tid)}},700)};
  $('#aD').onclick=()=>run(true);$('#aW').onclick=()=>{if(confirm('Write the converted values of the whole database into Player.bin? A backup is made first.'))run(false)}}
$('#allB2').onclick=allOpen;
if($('#misB2'))$('#misB2').onclick=()=>missing(null,'whole database');
document.addEventListener('change',e=>{const i=e.target.closest('input.ed');if(!i||PID==null)return;const o=CH[PID]||{};o.edits=Object.assign({},o.edits||{},{[i.dataset.a]:+i.value});CH[PID]=o;openPlayer(PID,o)});
async function stLoad(){const s=await api('/api/settings');ST=s;
  $('#st').innerHTML='<h3>Your database</h3><div><input id="dbp" value="'+E(s.dbpath||'')+'" placeholder="Folder with Player.bin, or the file itself" title="For example the folder pesdb, or the folder common, or _FL26MyWorld" style="font-size:.74rem"><button class="btn ghost sm" id="dbB" style="margin-top:4px">Use this</button>'+(s.loaded?'<p class="mut" style="margin:6px 0 0;font-size:.74rem">'+s.players.toLocaleString()+' players loaded.</p>':'<p class="msg err" style="margin-top:6px">'+(s.dbpath?'No Player.bin found there.':'Enter the path of your Player.bin first.')+'</p>')+'</div>'
   +'<div style="margin-top:8px"><span class="mut">Values are as of</span> <b>'+s.base+'</b><br><span class="mut">Write date</span> <input type="date" id="dt" value="'+E(s.date||'2026-09-01')+'" style="width:auto;display:inline-block;padding:3px 6px"><br>'+(s.months?'<span class="chip y">development '+SD(s.months)+' months</span>':'<span class="chip">no development</span>')+'</div>';
  const b=$('#dbB');if(b)b.onclick=async()=>{const r=await api('/api/settings',{dbpath:$('#dbp').value.trim()});if(r.ok===false){alert(r.msg);return}location.reload()};
  const d=$('#dt');if(d)d.onchange=async()=>{await api('/api/settings',{date:d.value});stLoad();if(CLUB)openClub(CLUB.tid)}}
let ST=null;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#dr').classList.remove('on');$('#dl').classList.remove('on')}});
init();stLoad();
</script></body></html>
