name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            sep: ':'
          - os: windows-latest
            name: windows
            sep: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pyinstaller
      - run: python tests/test_plbin.py && python tests/test_fcdb.py && python tests/test_sofifa.py
      - run: >
          pyinstaller --onefile --noconfirm --name fl-stats-converter-${{ matrix.name }}
          --paths flconv --paths flconv/lib
          --add-data "flconv/static${{ matrix.sep }}static"
          --add-data "flconv/data${{ matrix.sep }}data"
          --add-data "flconv/lib/ovr_weights_fl27.json${{ matrix.sep }}lib"
          flconv/server.py
      - uses: actions/upload-artifact@v4
        with:
          name: fl-stats-converter-${{ matrix.name }}
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
